<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Limpia - Acceso Ciudadano</title>
    
    <!-- Estilos de la interfaz de login -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-escudo {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            background-color: #0b4f6c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            font-size: 24px;
            color: #111;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #222;
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #0b4f6c;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #0b4f6c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #083b50;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #0b4f6c;
            border: 1.5px solid #0b4f6c;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background-color: #f0f4f8;
        }

        .mensaje-alerta {
            margin-top: 15px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .error { background-color: #f8d7da; color: #721c24; display: block; }
        .success { background-color: #d4edda; color: #155724; display: block; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-escudo">🏛️</div>
        <h2 id="tituloForm">Iniciar sesión</h2>

        <form id="authForm">
            <!-- Campo de Nombre (Solo se muestra al registrarse) -->
            <div class="form-group" id="grupoNombre" style="display: none;">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tucorreo@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-container">
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" id="btnAccion" class="btn-primary">Iniciar sesión</button>
            <button type="button" id="btnCambiarModo" class="btn-secondary" onclick="cambiarModo()">¿No tienes cuenta? Regístrate</button>
        </form>

        <div id="alerta" class="mensaje-alerta"></div>
    </div>

    <!-- Script de Autenticación conectado al Servidor Local Node.js -->
    <script>
        const API_URL = 'http://localhost:3000/api';
        let esRegistro = false;

        function togglePassword() {
            const inputPass = document.getElementById('password');
            inputPass.type = inputPass.type === 'password' ? 'text' : 'password';
        }

        function cambiarModo() {
            esRegistro = !esRegistro;
            const titulo = document.getElementById('tituloForm');
            const btnAccion = document.getElementById('btnAccion');
            const btnCambiar = document.getElementById('btnCambiarModo');
            const grupoNombre = document.getElementById('grupoNombre');
            const alerta = document.getElementById('alerta');
            alerta.style.display = 'none';

            if (esRegistro) {
                titulo.innerText = 'Crear cuenta ciudadana';
                btnAccion.innerText = 'Registrarse';
                btnCambiar.innerText = '¿Ya tienes cuenta? Inicia sesión';
                grupoNombre.style.display = 'block';
                document.getElementById('nombre').setAttribute('required', 'true');
            } else {
                titulo.innerText = 'Iniciar sesión';
                btnAccion.innerText = 'Iniciar sesión';
                btnCambiar.innerText = '¿No tienes cuenta? Regístrate';
                grupoNombre.style.display = 'none';
                document.getElementById('nombre').removeAttribute('required');
            }
        }

        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alerta = document.getElementById('alerta');

            alerta.style.display = 'block';

            if (esRegistro) {
                const nombre = document.getElementById('nombre').value;
                alerta.className = 'mensaje-alerta success';
                alerta.innerText = 'Registrando usuario y enviando correo de confirmación...';

                try {
                    const respuesta = await fetch(`${API_URL}/registro`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre, email, password })
                    });

                    const resultado = await respuesta.json();

                    if (respuesta.ok) {
                        alerta.className = 'mensaje-alerta success';
                        alerta.innerText = '¡Registro exitoso! Revisa tu correo electrónico para confirmar tu cuenta.';
                    } else {
                        alerta.className = 'mensaje-alerta error';
                        alerta.innerText = 'Error: ' + (resultado.error || 'No se pudo completar el registro.');
                    }
                } catch (error) {
                    alerta.className = 'mensaje-alerta error';
                    alerta.innerText = 'Error de red: No se pudo conectar con el servidor local.';
                }

            } else {
                alerta.className = 'mensaje-alerta success';
                alerta.innerText = 'Iniciando sesión...';

                try {
                    const respuesta = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const resultado = await respuesta.json();

                    if (respuesta.ok) {
                        // Guardar datos del usuario logueado en LocalStorage
                        localStorage.setItem('usuarioLogueado', JSON.stringify(resultado.usuario));
                        alerta.className = 'mensaje-alerta success';
                        alerta.innerText = '¡Acceso concedido! Redirigiendo...';

                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1200);
                    } else {
                        alerta.className = 'mensaje-alerta error';
                        alerta.innerText = resultado.mensaje || 'Correo o contraseña incorrectos.';
                    }
                } catch (error) {
                    alerta.className = 'mensaje-alerta error';
                    alerta.innerText = 'Error de red: No se pudo conectar con el servidor local.';
                }
            }
        });
    </script>
</body>
</html>
